# The gates that can run on a clean checkout.
#
# THREE of the project's four gates are reproducible from the repository alone
# and run here. It was two until the corpus was frozen; the fourth still is not,
# and saying so is more useful than pretending:
#
#   * the GOLDEN CORPUS runs here now, and used to be the first entry on this
#     list. `records/` is game data produced locally and deliberately
#     git-ignored, so `test_golden_corpus.py` still skips on a clean checkout --
#     but `tests/corpus/` carries the same fifty games with only OUR decisions
#     kept, 0.85 MB gzipped, with its snapshot committed beside it. The
#     flip-diff therefore runs on every push, which is the point: it is the most
#     useful review artefact this project produces and it was the one a reviewer
#     could not see;
#   * SELF-PLAY and the matchup matrix play hundreds of complete games. They
#     take minutes and answer a different question ("does this win more?"),
#     which belongs to the person proposing a strategy change, not to a push.
#
# See CONTRIBUTING.md for what to run locally before proposing one.

name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: tests on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the docs promise, and the newest we run on. The vendored
        # simulator ships an x86-64 ELF (`cg/libcg.so`), which is what this
        # runner is.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the test dependencies
        # The AGENT needs none of these: it runs in a container where nothing
        # gets installed. These are the runner, coverage and hypothesis.
        run: python -m pip install -r requirements-dev.txt

      - name: Test suite
        # Includes the Kaggle submission smoke test, which packages the tree
        # and loads it the way the competition container does.
        run: python -m pytest -q -rs

      - name: Architecture lint
        # R1-R4: the rules that keep the agent loadable on Kaggle. Each one
        # exists because it broke a submission once.
        run: python utils/lint_architecture.py

  cli:
    name: the tools still launch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every argparse script answers --help
        # `tests/test_cli.py` checks the wiring statically; this checks that the
        # parsers actually build. A script whose flags and attributes drifted
        # apart passed both for eight commits before the static check existed.
        run: |
          set -e
          for f in utils/*.py; do
            if grep -q "add_argument" "$f"; then
              python "$f" --help > /dev/null || { echo "FAILED: $f --help"; exit 1; }
            fi
          done
          echo "all argparse scripts answered --help"

  coverage:
    name: no module loses its watch
    # A RATCHET, not a target. `coverage-floors.json` records what the unit
    # suite covers of each module today; this fails when one of them drops.
    # It exists because ptcg/turn/options/evolve.py reached 6 % covered while
    # the diffs of that week were being written into it, and nothing said so.
    # See the header of utils/gate_coverage.py for what this number is NOT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Measure
        run: |
          python -m pytest -q --cov=main --cov=ptcg \
            --cov-report=json:coverage.json > /dev/null

      - name: Compare against the floors
        run: python utils/gate_coverage.py --check coverage.json

  mutation:
    name: the lines you added, are they watched
    # Mutates ONLY the lines this pull request adds and asks whether any test
    # goes red. A survivor is not proof the line is wrong -- it is proof that if
    # it ever becomes wrong, nothing will say so, and it prints the exact
    # rewrite that went unnoticed.
    #
    # NON-BLOCKING for now, and on purpose. Two versions of this gate have
    # already reported findings that were its own bugs, and a gate that wedges
    # the repository on a false positive teaches people to ignore it. It reports
    # for a while first; flip `continue-on-error` off once its output has been
    # right for a run or two.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the base of the PR, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate the gate before trusting its zero
        # Both halves against a file whose verdict is known. It aborts the run
        # rather than reporting, which is the only thing that has caught this
        # class of mistake in this repository.
        run: python utils/gate_mutation.py --self-test-only

      - name: Mutate the added lines
        run: python utils/gate_mutation.py --changed ${{ github.event.pull_request.base.sha }}
