[pytest]
python_files = test_*.py
pythonpath = .

# Where the suite lives. Every test of this project is in tests/ -- the rest of
# the tree holds game data, decks and notebooks, none of which pytest should
# walk. This is what makes the bare `python -m pytest -q` that CONTRIBUTING.md
# names as the first gate work on a machine that has ever run a gate.
testpaths = tests

# `log/` is the reason. A self-play gate copies the WHOLE tree -- suite
# included -- into log/<gate>/base_tree/ and log/<gate>/cand_tree/ so it can
# replay two revisions side by side. pytest then collects both copies, hits
# basename collisions against the real tests/ and dies. It never showed up in
# CI because log/ is git-ignored, so the documented first gate was red locally
# and green on a clean checkout. Deleting the copies does not fix it: the next
# gate run recreates them.
#
# Keep `.*` first: overriding norecursedirs DISCARDS pytest's default, and the
# default is the only thing keeping .venv-1/ and .git/ out.
norecursedirs = .* __pycache__ log log_analisys cg competitor_decks dataset deck notebook records docs
